button{font-family:inherit!important;font-weight:400!important}.app{position:relative;max-height:none;border-color:var(--header);box-shadow:5px 5px 0 #000;width:min(1080px,100%)}
header,footer{background:var(--header);border:0!important}header{min-height:60px}.brand h1{font-size:clamp(17px,2.3vw,27px);font-weight:400}.level-btn{font-size:17px}.level-btn.active{background:#ffd84d;border-color:#ffd84d;color:#3b2c5e}
main{min-height:440px;padding:18px;position:relative;background:linear-gradient(180deg,#7fd6ff,#fff3c4 75%,#eaf8d9)}.board{background:#fffaf2;max-width:850px;border-color:#c4b6e5;padding:18px 24px}.story{font-weight:400;font-size:21px}.question{font-weight:400;font-size:24px}.number-box{font-weight:400;font-size:45px}.number-box.long{font-size:25px}.choice{font-size:23px!important;font-weight:400!important;min-height:65px}.feedback{font-weight:400;font-size:20px}.action{font-size:20px;font-weight:400}.check{background:#7352b6;color:#fff;box-shadow:0 4px 0 #503587}.status{display:none}footer{text-align:right;font-size:21px;font-weight:400}footer span{color:#fff}
.start-cover{position:absolute;inset:0;z-index:10;background:linear-gradient(145deg,var(--cover-blue),var(--cover-yellow));display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;overflow:hidden;border-radius:19px}.start-cover[hidden]{display:none}.cover-content{position:relative;z-index:1;max-width:720px}.cover-content h2{font-size:clamp(31px,5vw,58px);font-weight:400;line-height:1.08;color:var(--title);margin:12px 0 18px}.cover-content p{font-size:25px;color:#344d64;line-height:1.3;margin:15px 0}.cover-label{display:inline-block;padding:6px 18px;border-radius:20px;background:#fff8d7;color:#375978;font-size:19px}.cover-levels{display:flex;justify-content:center;gap:12px;margin:22px 0}.cover-levels button{border:0;border-radius:17px;background:#fffaf0;color:#503b70;padding:12px 22px;font-size:23px;box-shadow:0 4px 0 #27445c25}.cover-levels small{display:block;font-size:17px;margin-top:4px}.cover-levels button[aria-pressed=true]{background:#f4edff;color:#483960}.start-btn{background:#ffd84d;color:#3b2c5e;border:0;border-radius:999px;padding:12px 40px;font-size:27px;box-shadow:0 5px 0 #60479a;cursor:pointer}.cover-decor{position:absolute;pointer-events:none;font-size:65px;animation:bob 4s ease-in-out infinite}.decor-a{left:5%;top:8%;transform:rotate(-15deg)}.decor-b{right:5%;bottom:8%;animation-delay:-2s}.decor-c{left:8%;bottom:10%;font-size:42px;animation-delay:-1s}.decor-d{right:8%;top:10%;font-size:45px;animation-delay:-3s}@keyframes bob{50%{translate:0 -10px;rotate:8deg}}@media(prefers-reduced-motion:reduce){.cover-decor{animation:none}}
@media(max-width:720px){body{padding:10px}.app{margin:auto}header{flex-wrap:nowrap;padding:8px;gap:5px;min-height:54px}.brand{gap:5px;min-width:0}.brand-icon{width:25px;height:25px}.brand h1{font-size:16px}.levels{gap:4px;flex:none}.level-btn{font-size:13px;padding:6px 7px}main{min-height:390px;padding:10px}.board{padding:13px 10px}.story{font-size:18px}.question{font-size:21px;margin:10px auto}.number-box{min-height:58px;font-size:36px}.number-box.long{font-size:20px;min-width:0;padding:8px 12px}.choices.three{grid-template-columns:repeat(3,minmax(0,1fr))}.choice{font-size:19px!important;min-height:55px}.feedback{font-size:18px}.action{font-size:18px;padding:8px 15px}footer{font-size:18px;padding:8px 12px}.start-cover{padding:20px 14px}.cover-content h2{font-size:35px}.cover-content p{font-size:21px}.cover-levels{gap:7px}.cover-levels button{font-size:20px;padding:10px 12px}.cover-levels small{font-size:14px}.cover-decor{font-size:42px;opacity:.7}.decor-c,.decor-d{font-size:32px}}

/* Hiasan statis: lingkaran besar dan bintang, tanpa animasi. */
.start-cover::before,.start-cover::after{content:"";position:absolute;border-radius:50%;pointer-events:none;width:210px;height:210px;z-index:0}
.start-cover::before{background:#fff4ae;left:-65px;top:-60px}
.start-cover::after{background:#ffd1dd;right:-60px;bottom:-80px;width:270px;height:270px}
.cover-decor{animation:none!important;translate:none;rotate:none;color:#e6b449;opacity:.55;font-family:Arial,sans-serif}
.decor-a{color:#b08ae0}.decor-b{color:#ec9db3}.decor-c{color:#e6b449}.decor-d{color:#b08ae0}

function markAnswer(){const t=state(),q=current();document.querySelectorAll('.choice').forEach(b=>{b.classList.toggle('selected',b.dataset.value===t.selected);if(t.locked){b.disabled=true;b.classList.toggle('correct',b.dataset.value===q.answer);b.classList.toggle('wrong',b.dataset.value===t.selected&&t.selected!==q.answer)}});if(t.locked){$('feedback').textContent=t.selected===q.answer?'Benar!':`Jawaban yang tepat: ${q.answer}.`;$('feedback').className='feedback '+(t.selected===q.answer?'good':'bad')}}
function render(){const t=state();$('score').textContent=t.score;$('replayBtn').style.display=t.finished?'inline-block':'none';if(t.finished){$('story').textContent='';$('numberBox').textContent='🏆';$('numberBox').className='number-box';$('question').textContent=`Level ${level+1} selesai!`;$('choices').innerHTML='';$('feedback').textContent='Hebat, terus berlatih!';$('feedback').className='feedback good';$('checkBtn').style.display='none';$('nextBtn').style.display='none';return}
const q=current();$('feedback').textContent='';$('feedback').className='feedback';$('checkBtn').style.display=t.locked?'none':'inline-block';$('nextBtn').style.display=t.locked?'inline-block':'none';$('nextBtn').textContent=t.index===questions[level].length-1?'Lihat Hasil':'Soal Berikutnya';$('story').textContent=q.story||'';$('numberBox').className='number-box';if(q.type==='place'){$('numberBox').textContent=q.number;$('question').innerHTML=`Angka <strong>${q.digit}</strong> berada pada tempat ...`}if(q.type==='decompose'){$('numberBox').textContent=q.number;$('question').textContent='Uraian bilangan yang benar adalah ...'}if(q.type==='compose'){$('numberBox').textContent=q.prompt;$('numberBox').classList.add('long');$('question').textContent='Bilangan yang terbentuk adalah ...'}const options=q.type==='place'?(q.choices||placeChoices):q.choices;$('choices').classList.toggle('three',options.length===3);$('choices').innerHTML=options.map(c=>`<button class="choice" data-value="${c}">${c}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(t.locked)return;t.selected=b.dataset.value;markAnswer()});markAnswer()}
function check(){const t=state();if(t.locked||t.finished)return;if(!t.selected){$('feedback').textContent='Pilih jawaban dahulu.';return}t.locked=true;t.answers[t.index]=t.selected;if(t.selected===current().answer){t.score+=10;sound('correct')}else sound('wrong');render()}
function next(){const t=state();if(!t.locked)return;if(t.index<questions[level].length-1){t.index++;t.selected='';t.locked=false}else{t.finished=true;sound('complete')}render()}
function selectLevel(i){level=i;document.querySelectorAll('.level-btn').forEach((b,n)=>b.classList.toggle('active',n===i));document.querySelectorAll('[data-cover]').forEach((b,n)=>b.setAttribute('aria-pressed',n===i));render()}
function replay(){questions[level].sort(()=>Math.random()-.5);states[level]={index:0,score:0,selected:'',locked:false,finished:false,answers:[]};render()}
document.querySelectorAll('.level-btn').forEach(b=>b.onclick=()=>selectLevel(+b.dataset.level));document.querySelectorAll('[data-cover]').forEach(b=>b.onclick=()=>selectLevel(+b.dataset.cover));$('checkBtn').onclick=check;$('nextBtn').onclick=next;$('replayBtn').onclick=replay;$('startBtn').onclick=()=>{started=true;$('startCover').hidden=true;speakInstruction()};render();
function fit(){document.body.style.zoom='1';requestAnimationFrame(()=>{const app=document.querySelector('.app');const ratio=Math.min(1,(innerHeight-24)/app.offsetHeight);if(ratio<1)document.body.style.zoom=String(ratio)})}window.addEventListener('resize',fit);document.fonts.ready.then(fit);
</script></body></html>
