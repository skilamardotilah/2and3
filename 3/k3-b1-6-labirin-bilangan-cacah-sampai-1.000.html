<!doctype html>
<html lang="id">
  <head>
    <meta name="color-scheme" content="only light" />
    <meta name="darkreader-lock" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>Labirin Bilangan sampai 1000</title>
    <style>
      600;700&family=Nunito:wght@600;700;800;900&family=Lato:wght@700;900&family=Londrina+Solid:wght@400&display=swap");
      :root{--ink:#17121f;--yellow:#ffd84d;--green:#45c77a;--red:#ef6461;--text:#4c3d38}
      *{box-sizing:border-box}
      html,body{min-height:100%}
      body{margin:0;padding:12px;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:"Londrina Solid",sans-serif;}
      .page-shell{width:100%;max-width:1120px;margin:auto}
      .sim-container{background:#fff;border:2px solid var(--ink);border-radius:22px;overflow:hidden;box-shadow:7px 7px 0 var(--ink)}
      header{border-bottom:4px solid var(--yellow);padding:11px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
      .brand{display:flex;align-items:center;gap:8px}
      .brand img{width:42px;height:42px;object-fit:contain}
      .brand h1{font:400 1.55rem "Londrina Solid";margin:0;letter-spacing:.02em}
      .levels{display:flex;gap:7px;flex-wrap:wrap}
      .level-btn{border:2px solid #fff3;border-radius:999px;padding:7px 12px;font:600 13px "Londrina Solid";cursor:pointer}
      .level-btn.active{}
      .sim-body{position:relative;padding:12px 14px 14px;overflow:hidden;transition:.25s}
      .sim-body.library{}
      .sim-body.museum{}
      .sim-body.lab{}
      .top-info{position:relative;z-index:2;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:9px}
      .story{border:2px solid #d7c1ad;border-radius:14px;padding:8px 12px;font-weight:900;font-size:14px;box-shadow:0 3px 0 #00000010}
      .status{background:var(--ink);color:#fff;border-radius:999px;padding:7px 12px;font:600 13px "Londrina Solid";white-space:nowrap}
      .status b{color:var(--yellow)}
      .game-layout{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:12px;align-items:center}
      #game-container{position:relative;background:#fff;border:3px solid #b8835d;border-radius:20px;padding:8px;height:min(62vh,570px);min-height:430px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 7px 0 #00000012}
      canvas{display:block;border-radius:12px;background:#fff}
      .controls{display:grid;grid-template-columns:repeat(3,48px);gap:7px;justify-content:center;align-self:center}
      .d-btn{width:48px;height:48px;border:0;border-radius:50%;background:var(--yellow);box-shadow:0 4px 0 #0002;font:700 20px "Londrina Solid";cursor:pointer;color:#5b3d00}
      .d-btn:active{transform:translateY(3px);box-shadow:none}
      .up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
      .hint{grid-column:1/-1;text-align:center;font-size:11px;font-weight:800;color:#72594f;margin-top:2px}
      .overlay{position:absolute;inset:0;background:#201923a8;display:none;align-items:center;justify-content:center;z-index:30;padding:14px}
      .card{width:min(520px,94%);background:#fff;border:4px solid #efb7c8;border-radius:22px;padding:18px;text-align:center;box-shadow:0 10px 0 #0002}
      .card .door{font-size:38px}.card h2{font:600 1.4rem "Londrina Solid";margin:3px 0 7px;color:#7b3d54}
      .question{font-weight:900;margin:5px 0 13px;font-size:16px}
      .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
      .choice{min-height:64px;border:3px solid #ead8ce;background:#fff;border-radius:14px;padding:8px;cursor:pointer;font:600 15px "Londrina Solid";color:#4d4651;box-shadow:0 3px 0 #00000012}
      .choice:hover{border-color:#9bbfe7;background:#f5faff}
      .choice.wrong{border-color:var(--red);background:#fff0f0}
      .feedback{min-height:23px;margin-top:8px;font:600 14px "Londrina Solid"}
      .win-icon{font-size:48px}
      .next-btn{border:0;border-radius:999px;background:var(--yellow);padding:10px 18px;font:600 15px "Londrina Solid";cursor:pointer;color:#5b3d00;box-shadow:0 4px 0 #0002}
      footer{border-top:4px solid var(--yellow);padding:8px 18px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:700 .72rem "Londrina Solid"}
      .decor{position:absolute;z-index:0;opacity:.25;font-size:42px;pointer-events:none}.d1{left:2%;top:8%}.d2{right:3%;top:12%}.d3{left:4%;bottom:5%}.d4{right:4%;bottom:5%}
      @media(max-width:760px){
       body{padding:5px;align-items:flex-start}.page-shell{max-width:none}.sim-container{border-radius:15px;box-shadow:3px 3px 0 var(--ink)}
       header{padding:9px 10px}.brand img{width:34px;height:34px}.brand h1{font-size:1.18rem}.levels{width:100%;justify-content:center}.level-btn{padding:6px 9px;font-size:11px}
       .sim-body{padding:8px}.top-info{grid-template-columns:1fr}.story{text-align:center;font-size:12px;padding:7px}.status{justify-self:center}
       .game-layout{grid-template-columns:1fr;gap:7px}#game-container{height:52vh;min-height:340px;padding:5px}
       .controls{grid-template-columns:repeat(3,43px);gap:5px}.d-btn{width:43px;height:43px;font-size:18px}
       .choices{grid-template-columns:1fr}.choice{min-height:48px;font-size:14px}.card{padding:13px}.question{font-size:14px}
       footer{padding:7px 10px}
      }

      .count-visual{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:7px;margin:8px auto 12px;max-width:470px;max-height:180px;overflow:auto;padding:8px;background:#fffaf1;border:2px dashed #e1c7a8;border-radius:14px}
      .count-hundred{display:grid;grid-template-columns:repeat(10,5px);grid-auto-rows:5px;gap:0;flex:0 0 50px;width:50px}
      .count-ten{display:grid;grid-template-columns:repeat(10,5px);grid-auto-rows:5px;gap:0;flex:0 0 50px;width:50px}
      .count-one{display:inline-flex}
      .count-icon{width:5px;height:5px;font-size:4px;line-height:5px;text-align:center;overflow:visible}
      @media(max-width:760px){
       .count-visual{max-height:130px;gap:5px;padding:6px}
       .count-hundred,.count-ten{grid-template-columns:repeat(10,4px);grid-auto-rows:4px;width:40px;flex-basis:40px}
       .count-icon{width:4px;height:4px;font-size:3.2px;line-height:4px}
      }
    </style>

    <style>
      /* Soal gambar: posisi selalu Ratusan - Puluhan - Satuan */
      .count-visual {
        display: grid !important;
        grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
        align-items: stretch !important;
        gap: 8px !important;
        max-width: 490px !important;
        max-height: none !important;
        overflow: visible !important;
        background: transparent !important;
        border: 0 !important;
        padding: 0 !important;
      }
      .place-group {
        min-width: 0;
        border-radius: 12px;
        padding: 6px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .place-group.hundreds {
        background: #fff1f5;
        border: 2px solid #f4bfd0;
      }
      .place-group.tens {
        background: #eef7ff;
        border: 2px solid #b8daf6;
      }
      .place-group.ones {
        background: #f0faee;
        border: 2px solid #bee3b8;
      }
      .place-label {
        font: 700 12px "Londrina Solid";
        margin-bottom: 5px;
      }
      .place-content {
        width: 100%;
        min-height: 74px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-content: center;
        align-items: center;
        gap: 5px;
      }
      .count-hundred {
        flex: 0 0 42px !important;
        width: 42px !important;
        height: 42px !important;
        grid-template-columns: repeat(10, 4.2px) !important;
        grid-template-rows: repeat(10, 4.2px) !important;
      }
      .count-ten {
        /* Semua puluhan tetap SATU kelompok, bukan tersebar menjadi area berbeda */
        flex: 0 0 auto !important;
        width: auto !important;
        display: grid !important;
        grid-template-columns: repeat(10, 4.2px) !important;
        grid-auto-rows: 4.2px !important;
        gap: 0 !important;
      }
      .count-one {
        display: inline-flex !important;
      }
      .count-icon {
        width: 4.2px !important;
        height: 4.2px !important;
        font-size: 3.4px !important;
        line-height: 4.2px !important;
      }
      @media (max-width: 760px) {
        .count-visual {
          gap: 4px !important;
        }
        .place-group {
          padding: 4px 2px;
        }
        .place-label {
          font-size: 10px;
        }
        .place-content {
          min-height: 58px;
          gap: 3px;
        }
        .count-hundred {
          flex-basis: 34px !important;
          width: 34px !important;
          height: 34px !important;
          grid-template-columns: repeat(10, 3.4px) !important;
          grid-template-rows: repeat(10, 3.4px) !important;
        }
        .count-ten {
          grid-template-columns: repeat(10, 3.4px) !important;
          grid-auto-rows: 3.4px !important;
        }
        .count-icon {
          width: 3.4px !important;
          height: 3.4px !important;
          font-size: 2.7px !important;
          line-height: 3.4px !important;
        }
      }
    </style>

    <style>
      body {
        padding-left: 8px !important;
        padding-right: 8px !important;
      }
      .page-shell {
        max-width: 1320px !important;
      }
      .story {
        border: 0 !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        padding: 2px 4px !important;
      }
      .game-layout {
        grid-template-columns: minmax(0, 1fr) 155px !important;
        gap: 18px !important;
      }
      .controls {
        width: 155px;
        grid-template-columns: repeat(3, 48px) !important;
        gap: 7px !important;
        justify-content: center !important;
        padding: 6px 0;
      }
      .hint {
        width: 100%;
        max-width: 155px;
        line-height: 1.3;
      }
      footer {
        min-height: 10px;
        padding: 0 !important;
        border-top: 4px solid var(--yellow);
      }
      @media (max-width: 900px) {
        .page-shell {
          max-width: calc(100vw - 10px) !important;
        }
        .game-layout {
          grid-template-columns: minmax(0, 1fr) 135px !important;
          gap: 10px !important;
        }
        .controls {
          width: 135px;
          grid-template-columns: repeat(3, 41px) !important;
          gap: 5px !important;
        }
        .d-btn {
          width: 41px !important;
          height: 41px !important;
        }
        .hint {
          max-width: 135px;
        }
      }
      @media (max-width: 760px) {
        .game-layout {
          grid-template-columns: 1fr !important;
        }
        .controls {
          width: auto;
          grid-template-columns: repeat(3, 43px) !important;
        }
        .hint {
          max-width: none;
        }
        .story {
          padding: 2px !important;
        }
      }
    </style>

      :root {

      class MazeGame {
        constructor() {
          this.canvas = document.getElementById("mazeCanvas");
          this.ctx = this.canvas.getContext("2d");
          this.container = document.getElementById("game-container");
          this.started = false;
          this.round = 0;
          this.answerLocked = false;
          this.cols = 6;
          this.rows = 6;
          this.level = 0;
          this.grid = [];
          this.doors = [];
          this.opened = new Set();
          this.wrong = new Set();
          this.score = 0;
          this.activeDoor = null;
          this.pending = null;
          this.over = false;
          this.doorOverlay = document.getElementById("doorOverlay");
          this.winOverlay = document.getElementById("winOverlay");
          document
            .querySelectorAll(".level-btn")
            .forEach(
              (b) => (b.onclick = () => this.loadLevel(+b.dataset.level)),
            );
          document.querySelectorAll("[data-move]").forEach(
            (b) =>
              (b.onclick = () => {
                let [dc, dr] = b.dataset.move.split(",").map(Number);
                this.move(dc, dr);
              }),
          );
          document.addEventListener("keydown", (e) => {
            let k = e.key.toLowerCase(),
              m = {
                arrowup: [0, -1],
                w: [0, -1],
                arrowright: [1, 0],
                d: [1, 0],
                arrowdown: [0, 1],
                s: [0, 1],
                arrowleft: [-1, 0],
                a: [-1, 0],
              }[k];
            if (m) {
              e.preventDefault();
              this.move(...m);
            }
          });
          document.getElementById("nextBtn").onclick = () =>
            this.loadLevel((this.level + 1) % 3);
          new ResizeObserver(() => {
            this.resize();
            this.draw();
          }).observe(this.container);
          this.loadLevel(0);
        }
        idx(c, r) {
          return c < 0 || r < 0 || c >= this.cols || r >= this.rows
            ? -1
            : c + r * this.cols;
        }
        neighbors(cell) {
          let a = [];
          [
            [0, -1],
            [1, 0],
            [0, 1],
            [-1, 0],
          ].forEach(([dc, dr]) => {
            let n = this.grid[this.idx(cell.c + dc, cell.r + dr)];
            if (n && !n.visited) a.push(n);
          });
          return a;
        }
        remove(a, b) {
          let x = a.c - b.c,
            y = a.r - b.r;
          if (x === 1) {
            a.walls[3] = false;
            b.walls[1] = false;
          }
          if (x === -1) {
            a.walls[1] = false;
            b.walls[3] = false;
          }
          if (y === 1) {
            a.walls[0] = false;
            b.walls[2] = false;
          }
          if (y === -1) {
            a.walls[2] = false;
            b.walls[0] = false;
          }
        }
        generate() {
          let cur = this.grid[0],
            stack = [];
          cur.visited = true;
          stack.push(cur);
          while (stack.length) {
            cur = stack.pop();
            let ns = this.neighbors(cur);
            if (ns.length) {
              stack.push(cur);
              let n = ns[Math.floor(Math.random() * ns.length)];
              this.remove(cur, n);
              n.visited = true;
              stack.push(n);
            }
          }
        }
        path() {
          let q = [{ c: 0, r: 0 }],
            prev = new Map([["0,0", null]]),
            key = (c, r) => c + "," + r;
          while (q.length) {
            let u = q.shift();
            if (u.c === 5 && u.r === 5) break;
            let cell = this.grid[this.idx(u.c, u.r)];
            [
              [0, -1, 0],
              [1, 0, 1],
              [0, 1, 2],
              [-1, 0, 3],
            ].forEach(([dc, dr, w]) => {
              if (cell.walls[w]) return;
              let c = u.c + dc,
                r = u.r + dr,
                k = key(c, r);
              if (this.idx(c, r) >= 0 && !prev.has(k)) {
                prev.set(k, u);
                q.push({ c, r });
              }
            });
          }
          let arr = [],
            u = { c: 5, r: 5 };
          while (u) {
            arr.push(u);
            u = prev.get(key(u.c, u.r));
          }
          return arr.reverse();
        }
        turns(p) {
          let t = 0,
            last = "";
          for (let i = 1; i < p.length; i++) {
            let d = p[i].c - p[i - 1].c + "," + (p[i].r - p[i - 1].r);
            if (last && d !== last) t++;
            last = d;
          }
          return t;
        }
        buildMaze() {
          let p = [],
            tries = 0;
          do {
            this.grid = [];
            for (let r = 0; r < 6; r++)
              for (let c = 0; c < 6; c++) this.grid.push(new Cell(c, r));
            this.generate();
            p = this.path();
            tries++;
          } while (tries < 60 && (p.length < 13 || this.turns(p) < 4));
          this.doors = [];
          let used = new Set();
          let total = LEVELS[this.level].questions.length;
          for (let i = 1; i <= total; i++) {
            let n = Math.round((i * (p.length - 2)) / (total + 1));
            n = Math.max(1, Math.min(p.length - 2, n));
            while (used.has(n) && n < p.length - 2) n++;
            used.add(n);
            this.doors.push({ id: i - 1, a: { ...p[n] }, b: { ...p[n + 1] } });
          }
        }
        loadLevel(n) {
          this.round++;
          this.answerLocked = false;
          this.level = n;
          let L = LEVELS[n];
          this.opened = new Set();
          this.wrong = new Set();
          this.score = 0;
          this.activeDoor = null;
          this.pending = null;
          this.over = false;
          this.player = { c: 0, r: 0 };
          this.goal = { c: 5, r: 5 };
          document
            .querySelectorAll(".level-btn")
            .forEach((b, i) => b.classList.toggle("active", i === n));
          let body = document.getElementById("simBody");
          body.className = "sim-body " + L.cls;
          document.getElementById("story").textContent = L.story;
          ["dec1", "dec2", "dec3", "dec4"].forEach(
            (id, i) => (document.getElementById(id).textContent = L.decor[i]),
          );
          document.getElementById("doorCount").textContent =
            `0/${L.questions.length}`;
          this.doorOverlay.style.display = "none";
          this.winOverlay.style.display = "none";
          this.buildMaze();
          this.update();
          this.resize();
          this.draw();
        }
        resize() {
          let w = this.container.clientWidth - 16,
            h = this.container.clientHeight - 16;
          this.size = Math.min(w / 6, h / 6);
          this.canvas.width = this.size * 6;
          this.canvas.height = this.size * 6;
        }
        doorBetween(c1, r1, c2, r2) {
          return this.doors.find(
            (d) =>
              (d.a.c === c1 && d.a.r === r1 && d.b.c === c2 && d.b.r === r2) ||
              (d.b.c === c1 && d.b.r === r1 && d.a.c === c2 && d.a.r === r2),
          );
        }
        shuffle(a) {
          a = [...a];
          for (let i = a.length - 1; i; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
          }
          return a;
        }
        renderCountVisual(v) {
          let host = document.getElementById("countVisual");
          host.innerHTML = "";
          if (!v) return;

          let wrap = document.createElement("div");
          wrap.className = "count-visual";

          let h = Math.floor(v.n / 100),
            t = Math.floor((v.n % 100) / 10),
            o = v.n % 10;

          const icon = () => {
            let s = document.createElement("span");
            s.className = "count-icon";
            s.textContent = v.icon;
            return s;
          };

          const makePlace = (label, cls) => {
            let group = document.createElement("div");
            group.className = "place-group " + cls;
            let title = document.createElement("div");
            title.className = "place-label";
            title.textContent = label;
            let content = document.createElement("div");
            content.className = "place-content";
            group.appendChild(title);
            group.appendChild(content);
            wrap.appendChild(group);
            return content;
          };

          const hundreds = makePlace("Ratusan", "hundreds");
          const tens = makePlace("Puluhan", "tens");
          const ones = makePlace("Satuan", "ones");

          /* Ratusan: setiap 100 benda menjadi satu blok 10 × 10. */
          for (let a = 0; a < h; a++) {
            let g = document.createElement("span");
            g.className = "count-hundred";
            for (let i = 0; i < 100; i++) g.appendChild(icon());
            hundreds.appendChild(g);
          }

          /* Puluhan: SEMUA puluhan dikumpulkan menjadi SATU grup.
     Contoh 324 = 2 baris × 10 ikon dalam area Puluhan. */
          if (t > 0) {
            let g = document.createElement("span");
            g.className = "count-ten";
            for (let i = 0; i < t * 10; i++) g.appendChild(icon());
            tens.appendChild(g);
          }

          /* Satuan berada sendiri di area Satuan. */
          for (let i = 0; i < o; i++) {
            let g = document.createElement("span");
            g.className = "count-one";
            g.appendChild(icon());
            ones.appendChild(g);
          }

          host.appendChild(wrap);
        }
        showQuestion(d, dc, dr) {
          this.activeDoor = d;
          this.pending = { dc, dr };
          let q = LEVELS[this.level].questions[d.id];
          document.getElementById("doorTitle").textContent =
            "Jawab soal untuk membuka pintu.";
          playGameSound("knock");
          document.getElementById("question").textContent = q.p;
          this.renderCountVisual(q.visual);
          document.getElementById("feedback").textContent = "";
          let box = document.getElementById("choices");
          box.innerHTML = "";
          this.shuffle(q.o).forEach((x) => {
            let b = document.createElement("button");
            b.className = "choice";
            b.textContent = x;
            b.onclick = () => {
              if (this.answerLocked) return;
              if (x === q.a) {
                this.answerLocked = true;
                box
                  .querySelectorAll("button")
                  .forEach((button) => (button.disabled = true));
                playGameSound("correct");
                let first = !this.wrong.has(d.id);
                if (first)
                  this.score += 100 / LEVELS[this.level].questions.length;
                this.opened.add(d.id);
                document.getElementById("feedback").style.color = "#278c52";
                document.getElementById("feedback").textContent = first
                  ? `Benar! +${Math.round(100 / LEVELS[this.level].questions.length)} poin. Pintu terbuka!`
                  : "Benar! Pintu terbuka!";
                this.update();
                let round = this.round;
                setTimeout(() => {
                  if (round !== this.round) return;
                  this.answerLocked = false;
                  this.doorOverlay.style.display = "none";
                  let m = this.pending;
                  this.activeDoor = null;
                  this.pending = null;
                  if (m) this.move(m.dc, m.dr, true);
                }, 450);
              } else {
                playGameSound("wrong");
                this.wrong.add(d.id);
                b.classList.add("wrong");
                document.getElementById("feedback").style.color = "#d94f4b";
                document.getElementById("feedback").textContent =
                  "Belum tepat. Coba lagi!";
                setTimeout(() => b.classList.remove("wrong"), 400);
              }
            };
            box.appendChild(b);
          });
          this.doorOverlay.style.display = "flex";
        }
        move(dc, dr, bypass = false) {
          if (!this.started || this.over || this.activeDoor) return;
          let cell = this.grid[this.idx(this.player.c, this.player.r)],
            ok =
              (dr === -1 && !cell.walls[0]) ||
              (dc === 1 && !cell.walls[1]) ||
              (dr === 1 && !cell.walls[2]) ||
              (dc === -1 && !cell.walls[3]);

            `Level ${this.level + 1} selesai! Skor: ${Math.round(this.score)}/100.`;
          let b = document.getElementById("nextBtn");

        draw() {
          let c = this.ctx,
            s = this.size;
          c.clearRect(0, 0, this.canvas.width, this.canvas.height);
          c.fillStyle = "#fff";
          c.fillRect(0, 0, this.canvas.width, this.canvas.height);
          this.grid.forEach((cell) => {
            let x = cell.c * s,
              y = cell.r * s;
            c.strokeStyle = "#5D4037";
            c.lineWidth = Math.max(2, s / 15);
            c.lineCap = "round";
            c.beginPath();
            if (cell.walls[0]) {
              c.moveTo(x, y);
              c.lineTo(x + s, y);
            }
            if (cell.walls[1]) {
              c.moveTo(x + s, y);
              c.lineTo(x + s, y + s);
            }
            if (cell.walls[2]) {
              c.moveTo(x + s, y + s);
              c.lineTo(x, y + s);
            }
            if (cell.walls[3]) {
              c.moveTo(x, y + s);
              c.lineTo(x, y);
            }
            c.stroke();
          });
          this.drawEmoji(5, 5, LEVELS[this.level].goal);
          this.drawDoors();
          this.drawPlayer(this.player.c, this.player.r);

        drawPlayer(col, row) {
          let s = this.size,
            c = this.ctx,
            x = col * s + s / 2,
            y = row * s + s / 2;
          if (!tikaImage.complete || !tikaImage.naturalWidth) {
            this.drawEmoji(col, row, "👧");
            return;
          }
          let w = s * 0.83,
            h = (w * tikaImage.naturalHeight) / tikaImage.naturalWidth;
          c.drawImage(tikaImage, x - w / 2, y - h / 2, w, h);
        }
        drawEmoji(col, row, e) {

          this.ctx.fillText(e, col * s + s / 2, row * s + s / 2);

        drawDoors() {
          let c = this.ctx,
            s = this.size;
          this.doors.forEach((d) => {
            if (this.opened.has(d.id)) return;
            let ax = d.a.c,
              ay = d.a.r,
              bx = d.b.c,
              by = d.b.r,
              x1,
              y1,
              x2,
              y2;
            if (ax !== bx) {
              let x = Math.max(ax, bx) * s;
              x1 = x;
              x2 = x;
              y1 = ay * s + s * 0.16;
              y2 = ay * s + s * 0.84;
            } else {
              let y = Math.max(ay, by) * s;
              y1 = y;
              y2 = y;
              x1 = ax * s + s * 0.16;
              x2 = ax * s + s * 0.84;
            }
            c.save();
            c.strokeStyle = "#8b5a2b";
            c.lineWidth = Math.max(5, s * 0.17);
            c.beginPath();
            c.moveTo(x1, y1);
            c.lineTo(x2, y2);
            c.stroke();
            c.strokeStyle = "#f2c14e";
            c.lineWidth = Math.max(2, s * 0.045);
            c.beginPath();
            c.moveTo(x1, y1);
            c.lineTo(x2, y2);
            c.stroke();
            let mx = (x1 + x2) / 2,
              my = (y1 + y2) / 2;
            c.fillStyle = "#fff7d6";
            c.beginPath();

            c.fillStyle = "#5d4037";
            c.font = `bold ${Math.max(9, s * 0.17)}px Arial`;

      const game = new MazeGame();
      tikaImage.onload = () => game.draw();
      document
        .querySelectorAll(".level-btn")
        .forEach((b, i) => (b.textContent = "Level " + (i + 1)));
      let coverLevel = 0;
      document.querySelectorAll("[data-cover]").forEach(
        (b) =>
          (b.onclick = () => {
            coverLevel = +b.dataset.cover;
            document
              .querySelectorAll("[data-cover]")
              .forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
          }),
      );
      document.getElementById("startBtn").onclick = () => {
        game.started = true;
        game.loadLevel(coverLevel);
        document.getElementById("startCover").hidden = true;
        speakInstruction();
      };
      function speakInstruction() {
        if (!("speechSynthesis" in window)) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(
          "Gunakan tombol arah untuk bergerak. Jawab soal untuk membuka pintu. Bantu Tika keluar dari labirin.",
        );
        u.lang = "id-ID";
        u.rate = 0.85;
        const voice = speechSynthesis
          .getVoices()
          .find((v) => v.lang.startsWith("id") && v.localService);
        if (voice) u.voice = voice;
        speechSynthesis.speak(u);
      }
      let audioContext;
      function playGameSound(kind) {
        try {
          const Engine = window.AudioContext || window.webkitAudioContext;
          if (!Engine) return;
          audioContext ||= new Engine();
          if (audioContext.state === "suspended") audioContext.resume();
          const notes =
            kind === "wrong"
              ? [
                  [200, 0, 0.13],
                  [140, 0.14, 0.18],
                ]
              : kind === "step"
                ? [[180, 0, 0.05]]
                : kind === "knock"
                  ? [
                      [110, 0, 0.07],
                      [110, 0.13, 0.07],
                    ]
                  : kind === "complete"
                    ? [
                        [523, 0, 0.15],
                        [659, 0.16, 0.15],
                        [784, 0.32, 0.15],
                        [1047, 0.48, 0.4],
                      ]
                    : [
                        [660, 0, 0.12],
                        [880, 0.13, 0.2],
                      ];
          notes.forEach(([f, d, t]) => {
            let o = audioContext.createOscillator(),
              g = audioContext.createGain(),
              start = audioContext.currentTime + d;
            o.type = kind === "knock" ? "triangle" : "sine";
            o.frequency.value = f;
            g.gain.setValueAtTime(0.09, start);
            g.gain.exponentialRampToValueAtTime(0.001, start + t);
            o.connect(g);
            g.connect(audioContext.destination);
            o.start(start);
            o.stop(start + t);
          });
        } catch (_) {}
      }
      function fitSimulation() {
        let shell = document.querySelector(".page-shell"),
          sim = document.querySelector(".sim-container");
        sim.style.zoom = 1;
        const available = innerHeight - 24;
        if (sim.offsetHeight > available)
          sim.style.zoom = Math.min(1, available / sim.offsetHeight);
        game.resize();
        game.draw();
      }
      window.addEventListener("resize", () =>
        requestAnimationFrame(fitSimulation),
      );
      document.fonts.ready.then(fitSimulation);
    </script>
